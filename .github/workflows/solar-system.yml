name: Solar System Workflow

on: 
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: 'mongodb+srv://supercluster.d83jj.mongodb.net/superData'
  MONGO_USERNAME: superuser
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
  
jobs:

    unit-testing:
        name: Unit Testing
        container:
          image: 
            node:20
        runs-on: ubuntu-latest
        steps:
        - name: Checkout Repository
          uses: actions/checkout@v4

#        - name: Setup NodeJS Version
#          uses: actions/setup-node@v4
#          with:
#            node-version: 20

        - name: Cache NPM dependencies
          uses: actions/cache@v4.3.0
          with:
            path: ~/.npm
            key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          
    
        - name: Install Dependencies
          run: npm install
    
        - name: Unit Testing
          run: npm test
          
        - name: Archive Test Result
          if: always()
          uses: actions/upload-artifact@v4
          with:
            name: Mocha-Test-Result
            path: test-results.xml
            



    code-coverage:
      name: code-coverage
      runs-on: ubuntu-latest

      steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install NodeJS - Version 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install
      
      - name: Code coverage
        continue-on-error: true
        run: npm run coverage
        

      - name: Code-Coverage-Result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5


    docker:
      name: containerization
      runs-on: ubuntu-latest
      needs: [ unit-testing, code-coverage ]
      permissions:
        packages: write
        
      steps:
        - name: checkout repo
          uses: actions/checkout@v4

        - name: container registry login
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.repository_owner }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build and Push docker image
          uses: docker/build-push-action@v3
          with:
            context: .  #Dockerfile is in root dir so . is used
            push: true  # false will build image but not push 
            tags: ghcr.io/${{ REPO_OWNER_LC }}/solar-system:${{github.sha}}


    dev-deploy:
      name: Deploy to Dev Environment
      runs-on: ubuntu-latest
      needs: docker
      environment: 
        name: development

      steps:
        - name: Install Kubernetes cluster
          uses: helm/kind-action@v1

        - name: deploy to cluster
          run: |
            sleep 60
            kubectl -n kube-system get pod
            set +e
            REPO_OWNER_LC="${GITHUB_REPOSITORY_OWNER,,}"
            kubectl run solar --image ghcr.io/${REPO_OWNER_LC}/solar-system:${{ github.sha }} \
              --env MONGO_URI=${{ env.MONGO_URI}} \
              --env MONGO_USERNAME=${{ env.MONGO_USERNAME}} \
              --env MONGO_PASSWORD=${{ env.MONGO_PASSWORD}}
            set -e
            echo "kubectl returned $?"
            kubectl -n default get pod
            sleep 10








